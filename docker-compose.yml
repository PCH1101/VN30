services:
  # -----------------------------------------------------------------------
  # ClickHouse — Time-Series OLAP Data Warehouse
  # -----------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: vn30_clickhouse
    ports:
      - "8123:8123"   # HTTP interface (REST / web UI / dbt-clickhouse)
      - "9000:9000"   # Native TCP interface
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/clickhouse/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    environment:
      CLICKHOUSE_DB: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # -----------------------------------------------------------------------
  # Apache Kafka — KRaft Mode (No ZooKeeper required)
  # -----------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vn30_kafka
    ports:
      - "9092:9092"   # Internal broker port
      - "9093:9093"   # Controller / External host port
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Kafka UI — Topic & Message Management UI (Port 8090)
  # -----------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vn30_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vn30-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # PostgreSQL — Airflow Metadata Database
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: vn30_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Airflow Init — Khởi tạo DB & tạo Admin User
  # -----------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka>=2.4.0 dbt-core>=1.8.0 dbt-clickhouse>=1.8.0 clickhouse-driver>=0.2.7 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./transform:/opt/airflow/transform
      - airflow_logs:/opt/airflow/logs
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
      "
    restart: "no"

  # -----------------------------------------------------------------------
  # Airflow Webserver — Web UI (Port 8088)
  # -----------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_webserver
    ports:
      - "8088:8080"   # Airflow Web UI
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka>=2.4.0 dbt-core>=1.8.0 dbt-clickhouse>=1.8.0 clickhouse-driver>=0.2.7 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-VCI}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./transform:/opt/airflow/transform
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Airflow Scheduler — Lên lịch & chạy Tasks
  # -----------------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_scheduler
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka>=2.4.0 dbt-core>=1.8.0 dbt-clickhouse>=1.8.0 clickhouse-driver>=0.2.7 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-VCI}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./transform:/opt/airflow/transform
      - airflow_logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Realtime Producer — Continuous Streaming Daemon
  # -----------------------------------------------------------------------
  realtime-producer:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_realtime_producer
    environment:
      PYTHONPATH: /opt/airflow
      TZ: Asia/Ho_Chi_Minh
      _PIP_ADDITIONAL_REQUIREMENTS: "confluent-kafka>=2.4.0 vnstock3>=0.3.0 aiohttp>=3.9.0 pydantic>=2.0.0 pydantic-settings>=2.0.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-VCI}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      PRODUCER_INTERVAL: ${PRODUCER_INTERVAL:-15}
      PRODUCER_CHECK_TRADING_HOUR: ${PRODUCER_CHECK_TRADING_HOUR:-false}
    entrypoint: ["/entrypoint", "bash", "-c", "python3 -m src.producers.kafka_producer --loop"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./src:/opt/airflow/src
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Grafana — BI Dashboard
  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: vn30_grafana
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"   # Grafana Web UI
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# -------------------------------------------------------------------------
# Named Volumes
# -------------------------------------------------------------------------
volumes:
  ch_data:
    name: vn30_ch_data
  kafka_data:
    name: vn30_kafka_data
  postgres_data:
    name: vn30_postgres_data
  grafana_data:
    name: vn30_grafana_data
  airflow_logs:
    name: vn30_airflow_logs
