services:
  # -----------------------------------------------------------------------
  # ClickHouse — Time-Series OLAP Data Warehouse
  # -----------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: vn30_clickhouse
    ports:
      - "8123:8123"   # HTTP interface (REST / web UI)
      - "9000:9000"   # Native TCP interface (clickhouse-driver)
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/clickhouse/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    environment:
      CLICKHOUSE_DB: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # -----------------------------------------------------------------------
  # MinIO — S3-Compatible Object Storage (Bronze Layer)
  # -----------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: vn30_minio
    ports:
      - "9001:9000"   # S3 API endpoint
      - "9002:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # MinIO Init — Tạo bucket vn30-bronze sau khi MinIO sẵn sàng
  # -----------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    container_name: vn30_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/vn30-bronze;
      echo '[OK] Bucket vn30-bronze ready';
      "
    restart: "no"

  # -----------------------------------------------------------------------
  # PostgreSQL — Airflow Metadata Database
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: vn30_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Airflow Init — Khởi tạo DB & tạo Admin User
  # -----------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: "polars>=0.20.0 pyarrow>=14.0.0 clickhouse-driver>=0.2.7 minio>=7.2.0 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
      "
    restart: "no"

  # -----------------------------------------------------------------------
  # Airflow Webserver — Web UI (Port 8080)
  # -----------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_webserver
    ports:
      - "8088:8080"   # Airflow Web UI
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "polars>=0.20.0 pyarrow>=14.0.0 clickhouse-driver>=0.2.7 minio>=7.2.0 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"
      MINIO_BUCKET_BRONZE: vn30-bronze
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-TCBS}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Airflow Scheduler — Lên lịch & chạy Tasks
  # -----------------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: vn30_airflow_scheduler
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "polars>=0.20.0 pyarrow>=14.0.0 clickhouse-driver>=0.2.7 minio>=7.2.0 pydantic>=2.0.0 pydantic-settings>=2.0.0 vnstock3>=0.3.0 aiohttp>=3.9.0"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: vn30
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vn30_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"
      MINIO_BUCKET_BRONZE: vn30-bronze
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-TCBS}
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Grafana — BI Dashboard
  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: vn30_grafana
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"   # Grafana Web UI
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# -------------------------------------------------------------------------
# Named Volumes
# -------------------------------------------------------------------------
volumes:
  ch_data:
    name: vn30_ch_data
  minio_data:
    name: vn30_minio_data
  postgres_data:
    name: vn30_postgres_data
  grafana_data:
    name: vn30_grafana_data
